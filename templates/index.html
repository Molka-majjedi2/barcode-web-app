<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>TUTTO SPORT ظ¤ Barcode Scanner</title>


<!-- ZXING -->

<script src="https://unpkg.com/@zxing/library@latest"></script>


<!-- GOOGLE FONTS -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>


<style>

/* =====================================================
   COLORS
===================================================== */

:root{

    --navy: #24234a;
    --navy-2: #34335f;

    --lime: #aad934;
    --lime-dark: #92bc21;
    --lime-soft: rgba(170,217,52,0.16);

    --bg: #f4f5f8;

    --surface: #ffffff;
    --surface-2: #f0f1f5;

    --border: #e3e5ec;

    --text: #1d1c36;
    --text-dim: #6c6e85;

    --danger: #e0555f;
    --danger-soft: rgba(224,85,95,0.1);

    --radius-lg: 22px;
    --radius-md: 15px;
    --radius-sm: 12px;
}


/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;
    padding:0;

    background:var(--bg);

    color:var(--text);

    font-family:
        'Inter',
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    -webkit-tap-highlight-color:transparent;
}


body{

    min-height:100vh;
    min-height:100dvh;

    display:flex;

    justify-content:center;

    padding:24px 16px 40px;
}


.app{

    width:100%;

    max-width:440px;

    display:flex;

    flex-direction:column;

    gap:18px;
}


/* =====================================================
   BRAND
===================================================== */

.brand{

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

    gap:10px;

    padding-top:4px;
}


.brand img{

    width:132px;

    height:auto;

    display:block;
}


.brand h1{

    font-family:'Sora',sans-serif;

    font-weight:700;

    font-size:20px;

    margin:2px 0 0;

    color:var(--navy);
}


.brand p{

    margin:0;

    font-size:13px;

    color:var(--text-dim);
}


/* =====================================================
   STATUS
===================================================== */

.status-pill{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:6px 13px;

    border-radius:100px;

    background:var(--surface-2);

    border:1px solid var(--border);

    font-size:12.5px;

    font-weight:600;

    color:var(--text-dim);

    white-space:nowrap;
}


.status-pill .dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--text-dim);
}


.status-pill.scanning{

    background:var(--lime-soft);

    border-color:rgba(170,217,52,0.5);

    color:var(--navy);
}


.status-pill.scanning .dot{

    background:var(--lime-dark);

    box-shadow:0 0 0 4px var(--lime-soft);

    animation:pulse 1.1s ease-in-out infinite;
}


.status-pill.found{

    background:var(--lime-soft);

    border-color:rgba(170,217,52,0.5);

    color:var(--navy);
}


.status-pill.found .dot{

    background:var(--lime-dark);

    box-shadow:0 0 0 4px var(--lime-soft);
}


.status-pill.error{

    background:var(--danger-soft);

    border-color:rgba(224,85,95,0.35);

    color:var(--danger);
}


.status-pill.error .dot{

    background:var(--danger);

    box-shadow:0 0 0 4px var(--danger-soft);
}


@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.35);
        opacity:.55;
    }

}


/* =====================================================
   SCANNER CARD
===================================================== */

.scanner-card{

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-lg);

    padding:16px;

    display:flex;

    flex-direction:column;

    gap:14px;

    box-shadow:
        0 24px 46px -32px
        rgba(36,35,74,0.35);
}


/* =====================================================
   VIDEO
===================================================== */

.viewport{

    position:relative;

    width:100%;

    aspect-ratio:3 / 4;

    border-radius:var(--radius-md);

    overflow:hidden;

    background:var(--navy);
}


#video{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


/* =====================================================
   IDLE
===================================================== */

.viewport-idle{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:10px;

    color:rgba(255,255,255,.7);

    background:
        linear-gradient(
            160deg,
            var(--navy-2),
            var(--navy) 70%
        );

    transition:opacity .3s ease;

    z-index:3;
}


.viewport-idle.hidden{

    opacity:0;

    pointer-events:none;
}


.viewport-idle svg{

    width:38px;
    height:38px;

    opacity:.85;

    stroke:var(--lime);
}


.viewport-idle span{

    font-size:13px;
}


/* =====================================================
   SCAN FRAME
===================================================== */

.scan-frame{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:92%;

    height:32%;

    z-index:4;

    opacity:0;

    transition:opacity .3s ease;
}


.scan-frame.active{

    opacity:1;
}


.corner{

    position:absolute;

    width:30px;

    height:30px;

    border:3px solid var(--lime);
}


.corner.tl{

    top:0;
    left:0;

    border-right:none;
    border-bottom:none;

    border-top-left-radius:8px;
}


.corner.tr{

    top:0;
    right:0;

    border-left:none;
    border-bottom:none;

    border-top-right-radius:8px;
}


.corner.bl{

    bottom:0;
    left:0;

    border-right:none;
    border-top:none;

    border-bottom-left-radius:8px;
}


.corner.br{

    bottom:0;
    right:0;

    border-left:none;
    border-top:none;

    border-bottom-right-radius:8px;
}


.scan-line{

    position:absolute;

    left:2%;
    right:2%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--lime),
            transparent
        );

    box-shadow:
        0 0 10px 1px
        rgba(170,217,52,.9);

    animation:sweep 2.1s ease-in-out infinite;
}


@keyframes sweep{

    0%{
        top:6%;
        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        top:92%;
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        top:6%;
        opacity:0;
    }

}


/* =====================================================
   DETECTION FLASH
===================================================== */

.flash-detect{

    position:absolute;

    inset:0;

    background:var(--lime);

    opacity:0;

    z-index:5;

    pointer-events:none;
}


.flash-detect.play{

    animation:flash .5s ease-out;
}


@keyframes flash{

    0%{
        opacity:.4;
    }

    100%{
        opacity:0;
    }

}


/* =====================================================
   HINT
===================================================== */

.hint-text{

    text-align:center;

    font-size:13px;

    color:var(--text-dim);
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{

    appearance:none;

    border:none;

    border-radius:var(--radius-sm);

    font-family:'Sora',sans-serif;

    font-weight:700;

    font-size:15px;

    padding:15px 20px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    cursor:pointer;

    transition:
        transform .15s ease,
        filter .15s ease,
        background .2s ease;

    width:100%;
}


.btn:active{

    transform:scale(.98);
}


.btn-primary{

    background:var(--lime);

    color:var(--navy);

    box-shadow:
        0 10px 22px -10px
        rgba(170,217,52,.7);
}


.btn-primary:hover{

    background:var(--lime-dark);
}


.btn-navy{

    background:var(--navy);

    color:#fff;
}


.btn-navy:hover{

    background:var(--navy-2);
}


.btn-outline{

    background:transparent;

    color:var(--navy);

    border:1.5px solid var(--border);
}


.btn-outline:hover{

    background:var(--surface-2);
}


/* =====================================================
   RESULT
===================================================== */

.result-area{

    min-height:4px;
}


.placeholder-box{

    text-align:center;

    padding:22px 12px;

    color:var(--text-dim);

    font-size:13.5px;

    background:var(--surface);

    border:1px dashed var(--border);

    border-radius:var(--radius-md);
}


.message-box{

    display:flex;

    align-items:flex-start;

    gap:12px;

    padding:16px;

    border-radius:var(--radius-md);

    font-size:13.5px;

    line-height:1.45;

    border:1px solid var(--border);

    background:var(--surface);
}


.message-box.error{

    border-color:
        rgba(224,85,95,.35);

    background:
        var(--danger-soft);

    color:#a83f47;
}


.message-box .icon{

    flex-shrink:0;

    font-size:17px;

    line-height:1;

    margin-top:1px;
}


.msg-title{

    font-weight:700;

    font-family:'Sora',sans-serif;

    font-size:14px;

    margin-bottom:2px;

    color:var(--navy);
}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius-lg);

    overflow:hidden;

    animation:rise .35s ease both;

    box-shadow:
        0 24px 46px -32px
        rgba(36,35,74,.3);
}


@keyframes rise{

    from{

        opacity:0;

        transform:translateY(10px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }

}


.card-top{

    background:var(--navy);

    padding:18px 20px;

    display:flex;

    flex-direction:column;

    gap:8px;
}


.found-tag{

    display:inline-flex;

    align-items:center;

    gap:6px;

    align-self:flex-start;

    font-size:11.5px;

    font-weight:700;

    color:var(--navy);

    background:var(--lime);

    padding:5px 10px;

    border-radius:100px;
}


.product-card h2{

    font-family:'Sora',sans-serif;

    font-size:19px;

    font-weight:700;

    margin:0;

    color:#fff;
}


.product-fields{

    display:flex;

    flex-direction:column;

    padding:6px 20px 4px;
}


.field{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    padding:12px 0;

    border-bottom:1px solid var(--border);

    font-size:13.5px;
}


.field:last-child{

    border-bottom:none;
}


.field .label{

    color:var(--text-dim);
}


.field .value{

    font-weight:600;

    text-align:right;

    color:var(--navy);

    word-break:break-word;
}


.card-actions{

    display:flex;

    flex-direction:column;

    gap:10px;

    padding:14px 20px 20px;
}


@media (min-width:400px){

    .card-actions{

        flex-direction:row;
    }

    .card-actions .btn{

        width:auto;

        flex:1;
    }

}


/* =====================================================
   FOOTER
===================================================== */

footer{

    text-align:center;

    font-size:11.5px;

    color:#a4a6b6;

    margin-top:2px;
}

</style>

</head>


<body>


<div class="app">


    <!-- BRAND -->

    <div class="brand">

        <img
            src="{{ url_for('static', filename='logo1.png') }}"
            alt="TUTTO SPORT"
        >

        <h1>Barcode Scanner</h1>

        <p>
            Scannez un code-barres pour identifier un produit
        </p>

        <div
            class="status-pill"
            id="statusPill"
        >

            <span class="dot"></span>

            <span id="statusText">
                Idle
            </span>

        </div>

    </div>


    <!-- SCANNER -->

    <div class="scanner-card">


        <div
            class="viewport"
            id="viewport"
        >


            <video
                id="video"
                playsinline
                muted
            ></video>


            <div
                class="viewport-idle"
                id="viewportIdle"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke-width="1.5"
                >

                    <path
                        d="M4 7V5a1 1 0 0 1 1-1h2M20 7V5a1 1 0 0 0-1-1h-2M4 17v2a1 1 0 0 0 1 1h2M20 17v2a1 1 0 0 1-1 1h-2M6 12h12"
                        stroke-linecap="round"
                    />

                </svg>

                <span>
                    Cam├رra en attente
                </span>

            </div>


            <!-- SCAN FRAME -->

            <div
                class="scan-frame"
                id="scanFrame"
            >

                <div class="corner tl"></div>

                <div class="corner tr"></div>

                <div class="corner bl"></div>

                <div class="corner br"></div>

                <div class="scan-line"></div>

            </div>


            <div
                class="flash-detect"
                id="flashDetect"
            ></div>


        </div>


        <p class="hint-text">
            Placez le code-barres dans le cadre
        </p>


        <button
            class="btn btn-primary"
            id="scanBtn"
            onclick="startScan()"
        >

            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <rect
                    x="3"
                    y="6"
                    width="18"
                    height="12"
                    rx="2"
                />

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                />

            </svg>

            Start Scan

        </button>


    </div>


    <!-- RESULT -->

    <div
        class="result-area"
        id="resultArea"
    >

        <div class="placeholder-box">
            No code scanned
        </div>

    </div>


    <footer>
        TUTTO SPORT ┬╖ Product Scanner
    </footer>


</div>


<!-- Legacy result -->

<p
    id="result"
    style="display:none;"
></p>


<script>

/* ==========================================================
   ZXING CONFIGURATION
   ========================================================== */


/*
   On autorise plusieurs formats de codes-barres 1D.

   Le code de ta photo est un code-barres num├رrique
   classique, donc on teste notamment :

   - UPC_A
   - EAN_13
   - EAN_8
   - CODE_128
   - ITF
   - CODE_39
   - CODE_93
   - CODABAR
*/


const hints = new Map();


hints.set(

    ZXing.DecodeHintType.POSSIBLE_FORMATS,

    [

        ZXing.BarcodeFormat.UPC_A,

        ZXing.BarcodeFormat.UPC_E,

        ZXing.BarcodeFormat.EAN_13,

        ZXing.BarcodeFormat.EAN_8,

        ZXing.BarcodeFormat.CODE_128,

        ZXing.BarcodeFormat.CODE_39,

        ZXing.BarcodeFormat.CODE_93,

        ZXing.BarcodeFormat.ITF,

        ZXing.BarcodeFormat.CODABAR

    ]

);


/*
   TRY_HARDER est tr├ذs important pour les codes
   difficiles ├ب lire avec la cam├رra.
*/

hints.set(
    ZXing.DecodeHintType.TRY_HARDER,
    true
);


/* ==========================================================
   READER
   ========================================================== */

const codeReader =
    new ZXing.BrowserMultiFormatReader(
        hints,
        500
    );


let lastCode = "";

let isScanning = false;


/* ==========================================================
   HTML ELEMENTS
   ========================================================== */

const statusPill =
    document.getElementById("statusPill");

const statusText =
    document.getElementById("statusText");

const viewport =
    document.getElementById("viewport");

const viewportIdle =
    document.getElementById("viewportIdle");

const scanFrame =
    document.getElementById("scanFrame");

const flashDetect =
    document.getElementById("flashDetect");

const resultArea =
    document.getElementById("resultArea");

const scanBtn =
    document.getElementById("scanBtn");


/* ==========================================================
   STATUS
   ========================================================== */

function setStatus(mode, label){

    statusPill.className =
        "status-pill" +
        (mode ? " " + mode : "");

    statusText.textContent =
        label;
}


/* ==========================================================
   SCANNER VISUAL
   ========================================================== */

function setScanningVisuals(active){

    viewportIdle.classList.toggle(
        "hidden",
        active
    );

    scanFrame.classList.toggle(
        "active",
        active
    );

    viewport.classList.toggle(
        "active",
        active
    );
}


/* ==========================================================
   PLACEHOLDER
   ========================================================== */

function renderPlaceholder(){

    resultArea.innerHTML =
        '<div class="placeholder-box">' +
        'No code scanned' +
        '</div>';
}


/* ==========================================================
   SEARCHING
   ========================================================== */

function renderConnecting(code){

    resultArea.innerHTML = `

        <div class="message-box">

            <span class="icon">≡ا¤</span>

            <div>

                <div class="msg-title">
                    Recherche du produitظخ
                </div>

                Code d├رtect├ر :
                <strong>${code}</strong>

            </div>

        </div>

    `;
}


/* ==========================================================
   NOT FOUND
   ========================================================== */

function renderNotFound(code){

    resultArea.innerHTML = `

        <div class="message-box">

            <span class="icon">ظأبي╕</span>

            <div>

                <div class="msg-title">
                    Barcode not found
                </div>

                Aucun produit ne correspond ├ب :

                <strong>${code}</strong>

            </div>

        </div>


        <button
            class="btn btn-outline"
            style="margin-top:12px;"
            onclick="resetScan()"
        >

            Try Again

        </button>

    `;
}


/* ==========================================================
   SERVER ERROR
   ========================================================== */

function renderServerError(){

    resultArea.innerHTML = `

        <div class="message-box error">

            <span class="icon">ظؤ¤</span>

            <div>

                <div class="msg-title">
                    Serveur indisponible
                </div>

                Impossible de contacter le serveur.

                V├رrifiez votre connexion et r├رessayez.

            </div>

        </div>


        <button
            class="btn btn-outline"
            style="margin-top:12px;"
            onclick="resetScan()"
        >

            Try Again

        </button>

    `;
}


/* ==========================================================
   PRODUCT
   ========================================================== */

function renderProduct(data, code){

    const idRow = data.id_product

        ? `

            <div class="field">

                <span class="label">
                    ID Product
                </span>

                <span class="value">
                    ${data.id_product}
                </span>

            </div>

          `

        : "";


    const priceRow =

        data.price !== null &&
        data.price !== undefined

        ? `

            <div class="field">

                <span class="label">
                    Price
                </span>

                <span class="value">
                    ${data.price} TN
                </span>

            </div>

          `

        : "";


    resultArea.innerHTML = `

        <div class="product-card">


            <div class="card-top">

                <span class="found-tag">
                    ظù Produit trouv├ر
                </span>

                <h2>
                    ${data.name || "Produit"}
                </h2>

            </div>


            <div class="product-fields">


                <div class="field">

                    <span class="label">
                        Barcode
                    </span>

                    <span class="value">
                        ${code}
                    </span>

                </div>


                <div class="field">

                    <span class="label">
                        Article
                    </span>

                    <span class="value">
                        ${data.article || "ظ¤"}
                    </span>

                </div>


                <div class="field">

                    <span class="label">
                        Category
                    </span>

                    <span class="value">
                        ${data.category || "ظ¤"}
                    </span>

                </div>


                ${idRow}

                ${priceRow}


            </div>


            <div class="card-actions">


                <a
                    class="btn btn-navy"
                    href="${data.url}"
                    target="_blank"
                    style="text-decoration:none;"
                >

                    Open Product

                </a>


                <button
                    class="btn btn-outline"
                    onclick="resetScan()"
                >

                    Scan Again

                </button>


            </div>


        </div>

    `;
}


/* ==========================================================
   FLASH DETECTION
   ========================================================== */

function playDetectionFlash(){

    flashDetect.classList.remove(
        "play"
    );

    void flashDetect.offsetWidth;

    flashDetect.classList.add(
        "play"
    );
}


/* ==========================================================
   RESET
   ========================================================== */

function resetScan(){

    try{

        codeReader.reset();

    }

    catch(e){

        console.log(
            "Reset error:",
            e
        );

    }


    lastCode = "";

    isScanning = false;


    setStatus(
        "",
        "Idle"
    );


    setScanningVisuals(
        false
    );


    renderPlaceholder();


    scanBtn.textContent =
        "Start Scan";


    setTimeout(

        function(){

            startScan();

        },

        300

    );

}


/* ==========================================================
   CAMERA ERROR
   ========================================================== */

function showCameraError(error){

    console.error(
        "CAMERA ERROR:",
        error
    );


    isScanning = false;


    setStatus(
        "error",
        "Camera error"
    );


    setScanningVisuals(
        false
    );


    scanBtn.textContent =
        "Start Scan";


    resultArea.innerHTML = `

        <div class="message-box error">

            <span class="icon">
                ≡اô╖
            </span>

            <div>

                <div class="msg-title">
                    Impossible d'utiliser la cam├رra
                </div>

                <p>
                    V├رrifiez que le navigateur poss├ذde
                    l'autorisation d'utiliser la cam├رra.
                </p>

            </div>

        </div>

    `;
}


/* ==========================================================
   START SCAN
   ========================================================== */

async function startScan(){

    if(isScanning){

        return;

    }


    const video =
        document.getElementById("video");


    try{


        /* -----------------------------------------------
           RESET ANCIEN SCAN
        ------------------------------------------------ */

        try{

            codeReader.reset();

        }

        catch(e){

            console.log(e);

        }


        lastCode = "";

        isScanning = true;


        scanBtn.textContent =
            "Scanningظخ";


        setStatus(
            "scanning",
            "Scanning..."
        );


        setScanningVisuals(
            true
        );


        /* -----------------------------------------------
           CAMERA
        ------------------------------------------------ */

        const constraints = {

            video: {

                facingMode: {

                    ideal: "environment"

                },


                width: {

                    ideal: 1920

                },


                height: {

                    ideal: 1080

                },


                frameRate: {

                    ideal: 30

                }

            }

        };


        /* -----------------------------------------------
           START ZXING
        ------------------------------------------------ */

        codeReader.decodeFromConstraints(

            constraints,

            video,

            async function(result, err){


                /* ========================================
                   BARCODE DETECTED
                ======================================== */

                if(result){


                    const code =
                        String(
                            result.text
                        ).trim();


                    console.log(
                        "================================"
                    );

                    console.log(
                        "BARCODE DETECTED:",
                        code
                    );

                    console.log(
                        "================================"
                    );


                    /* ------------------------------------
                       PREVENT DUPLICATE
                    ------------------------------------ */

                    if(code === lastCode){

                        return;

                    }


                    lastCode = code;

                    isScanning = false;


                    playDetectionFlash();


                    document
                        .getElementById("result")
                        .innerHTML =
                        "Barcode : " + code;


                    renderConnecting(
                        code
                    );


                    /* ------------------------------------
                       STOP CAMERA
                    ------------------------------------ */

                    try{

                        codeReader.reset();

                    }

                    catch(e){

                        console.log(e);

                    }


                    setScanningVisuals(
                        false
                    );


                    /* ====================================
                       SEARCH MYSQL
                    ==================================== */

                    try{


                        const response =
                            await fetch(

                                "/search?code=" +
                                encodeURIComponent(
                                    code
                                )

                            );


                        if(!response.ok){

                            throw new Error(
                                "HTTP " +
                                response.status
                            );

                        }


                        const data =
                            await response.json();


                        console.log(
                            "MYSQL RESPONSE:",
                            data
                        );


                        /* =================================
                           PRODUCT FOUND
                        ================================= */

                        if(data.found){


                            setStatus(
                                "found",
                                "Found"
                            );


                            scanBtn.textContent =
                                "Start Scan";


                            renderProduct(
                                data,
                                code
                            );


                            /* --------------------------------
                               OPEN PRODUCT
                            -------------------------------- */

                            if(data.url){

                                window.open(
                                    data.url,
                                    "_blank"
                                );

                            }

                        }


                        /* =================================
                           NOT FOUND
                        ================================= */

                        else{


                            setStatus(
                                "error",
                                "Not found"
                            );


                            scanBtn.textContent =
                                "Start Scan";


                            renderNotFound(
                                code
                            );

                        }


                    }


                    catch(error){


                        console.error(
                            "SEARCH ERROR:",
                            error
                        );


                        setStatus(
                            "error",
                            "Server error"
                        );


                        scanBtn.textContent =
                            "Start Scan";


                        renderServerError();

                    }


                    return;

                }


                /* ========================================
                   ZXING ERROR
                ======================================== */

                if(

                    err &&

                    err.name !==
                    "NotFoundException"

                ){

                    console.log(
                        "ZXING ERROR:",
                        err
                    );

                }

            }

        );


    }


    catch(error){

        showCameraError(
            error
        );

    }

}

</script>


</body>

</html>
